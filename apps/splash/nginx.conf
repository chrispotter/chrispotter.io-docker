# www -> apex, done here rather than in the proxy so it stays portable.
# nginx-proxy passes the original Host header through, so this container
# sees the real hostname and can redirect on its own.
server {
    listen 80;
    server_name www.chrispotter.io;
    return 301 https://chrispotter.io$request_uri;
}

server {
    listen 80 default_server;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
        # One header only. The `expires` directive emits its own Cache-Control,
        # so pairing it with add_header sends two conflicting ones.
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Cheap endpoint for the compose healthcheck.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
