# The only file you run:  docker compose up -d
#
# include: needs Compose v2.20+. Per-app files stay separate and readable;
# this stitches them into one project.
name: chrispotter

include:
  - proxy/compose.yaml
  - apps/splash/compose.yaml
  # Uncomment once DEX_GITHUB_CLIENT_ID, DEX_GITHUB_CLIENT_SECRET and
  # DEX_MCP_CLIENT_SECRET exist as repo secrets, and the auth A record
  # resolves. Its `:?` guards fail the whole project otherwise -- not
  # just Dex -- which blocks every compose command on the droplet.
  # - auth/compose.yaml
  # - apps/boardgames/compose.yaml    # Phase 2

networks:
  # Created once, out of band:  docker network create edge
  # Declared external so behaviour is consistent across Compose versions
  # rather than depending on how include: merges network definitions.
  edge:
    external: true
