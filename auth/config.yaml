# Dex — OIDC authorization server for chrispotter.io services.
#
# Dex does not store users. It federates to GitHub and speaks OIDC to our
# services, which is what lets the MCP server point OAUTH_ISSUER at something
# that publishes RFC 8414 metadata and a JWKS. GitHub alone cannot do that for
# user login, which is the whole reason this exists.
#
# $VARS below are expanded by Dex from the container environment, so no secret
# is committed. See auth/compose.yaml for where they come from.

issuer: https://auth.chrispotter.io

storage:
  type: sqlite3
  config:
    file: /var/dex/dex.db

web:
  # Plain HTTP here; nginx-proxy terminates TLS in front.
  http: 0.0.0.0:5556

  # CORS, and it is load-bearing for the Ludoteca rather than decorative.
  #
  # The UI is a different origin (boardgames.chrispotter.io) and reads two
  # things from here with fetch: the discovery document, to find out where
  # /auth and /token are, and then /token, to exchange its authorization
  # code. Both are plain cross-origin reads, so without an
  # Access-Control-Allow-Origin on the response the browser discards it and
  # the app sees "Failed to fetch" -- before any redirect happens, so the
  # failure looks like Dex being down rather than a header being absent.
  #
  # The redirect legs need nothing here: a browser navigating to /auth is not
  # a fetch and no origin policy applies to it. Only the two reads do, which
  # is why signing in got this far without it.
  #
  # One origin, exactly, and never "*": the exchange is what turns a code
  # into a token, and that is not a response to hand to any page that asks.
  # The MCP clients are unaffected -- a CLI and a server-side exchange are
  # not browsers and send no Origin.
  allowedOrigins:
    - https://boardgames.chrispotter.io

# One user, who is also the operator. An approval screen on every token
# exchange is friction with no security value at this scale.
oauth2:
  skipApprovalScreen: true

  # PKCE is NOT enforced, and this is the place to notice that. The control
  # is oauth2.pkce (enforce: true, codeChallengeMethodsSupported: [S256]),
  # which exists only from v2.46.0 -- and v2.46.0 hangs here, so auth/compose.yaml
  # pins v2.45.1. Leaving the block in would be config that claims a control
  # Dex silently ignores, so it is out until a v2.46.x is usable.
  #
  # Meanwhile PKCE is opt-in: discovery advertises S256 and plain, and an
  # authorization request with no code_challenge is accepted. Claude Code
  # sends S256 of its own accord, but boardgames-mcp-cli is a public client
  # with no secret, so for it PKCE is the only thing binding a code to the
  # client that asked for it -- and nothing here requires it.

# No local password database -- GitHub is the only way in.
enablePasswordDB: false

connectors:
  - type: github
    id: github
    name: GitHub
    config:
      clientID: $DEX_GITHUB_CLIENT_ID
      clientSecret: $DEX_GITHUB_CLIENT_SECRET
      redirectURI: https://auth.chrispotter.io/callback

      # WHO MAY SIGN IN. Both controls are in force; they answer different
      # questions and neither replaces the other.
      #
      # A bare GitHub connector authenticates *any* GitHub account. It proves
      # someone is a GitHub user; it does not prove they are you. That was the
      # state of things until now: a stranger could complete the whole flow
      # and come away with a token carrying a valid issuer, audience and
      # signature -- everything a resource server checks except identity.
      #
      # `orgs` below is the first control, and the only one Dex itself
      # offers. Everything past it is the second: the MCP server allowlists
      # subjects (MCP_ALLOWED_SUBJECTS) and the API allowlists verified email
      # addresses (API_ADMIN_EMAILS), so even a member of the org who is not
      # on those lists gets a genuine token that buys exactly what a visitor
      # already has -- reads. chrispotter.io-docker#1 chose the second,
      # #18 turned it on, and this adds the first in front of it.
      #
      # Dex has no per-user allowlist, so membership of an organization is the
      # nearest thing to naming one account. chrispotter-sso exists for this
      # and nothing else: no repositories, one member.
      #
      # It is named for the identity service rather than for an app on
      # purpose. This key sits on the *connector*, so it gates every client
      # Dex serves -- boardgames-ui, boardgames-mcp-cli, claude-ai, and
      # whatever comes next -- and there is no per-client equivalent. An org
      # named after one app would have been the login gate for all the
      # others.
      #
      # The consequence worth remembering is the inversion: adding somebody
      # to that organization grants them a login to everything behind
      # auth.chrispotter.io. It is a gate, not a place to collaborate from.
      #
      # Renaming it is a config change here as well. GitHub redirects an old
      # organization URL in a browser, but GET /orgs/<old>/members answers
      # 404, which is the call this check makes -- so a rename that is not
      # mirrored here locks everybody out rather than degrading quietly.
      #
      # Setting this makes Dex ask GitHub for read:org alongside user:email,
      # so the consent screen changes and the app may need approving for the
      # organization. Membership can stay private: read:org sees it either
      # way, and nothing here requires a public member.
      orgs:
        - name: chrispotter-sso

staticClients:
  # CLI client -- Claude Code and anything else that runs locally.
  #
  # `public: true` means no client secret, which is correct: a CLI cannot keep
  # one. With `redirectURIs` omitted, Dex accepts any callback beginning with
  # http://localhost (any port, any path), plus the out-of-browser
  # urn:ietf:wg:oauth:2.0:oob form. That is what a CLI needs when it binds a
  # throwaway port per login.
  #
  # Note this is not a wildcard -- Dex deliberately does not support those,
  # because an arbitrary wildcard redirect is an open-redirect vulnerability.
  # The localhost allowance is a narrow, documented exception.
  - id: boardgames-mcp-cli
    name: Board Game MCP (CLI)
    public: true

  # The MCP server's own entry. It never performs a flow; it exists so that a
  # token can be audience-bound to the resource.
  #
  # Dex implements no RFC 8707 `resource` parameter, and it always signs `aud`
  # as a *client ID* -- never an arbitrary URI. Its only cross-client mechanism
  # is the scope audience:server:client_id:<peer>, which puts <peer> in the
  # audience. So the peer's id has to BE the resource URI the MCP server
  # checks against (MCP_RESOURCE_URL), character for character.
  #
  # trustedPeers is the precondition that makes it work: Dex refuses the
  # cross-client scope unless the peer names the requesting client here.
  - id: https://boardgames-mcp.chrispotter.io/mcp
    name: Board games MCP server
    # No secret: nothing ever authenticates as this client. `public: true`
    # because a static client must be one or the other, not because a flow
    # runs here.
    public: true
    trustedPeers:
      - boardgames-mcp-cli
      - claude-ai

  # The hosted client: claude.ai connectors, and Claude sessions in the desktop
  # app. This is the entry the comment here used to say was waiting on two
  # unknowns; both are now answered.
  #
  # The redirect URI is documented rather than guessed:
  # https://claude.com/docs/connectors/custom/remote-mcp names
  # https://claude.ai/api/mcp/auth_callback as the callback to register. Exact,
  # because Dex matches a non-public client's redirect URIs exactly -- and it
  # must be the final URL, since a 30x on the way would drop the Authorization
  # header.
  #
  # And Dynamic Client Registration turned out not to be required: the connector
  # dialog offers "use your own OAuth client", which is what this entry is for.
  # Dex publishes no registration_endpoint, so without that option none of this
  # would be reachable.
  #
  # Confidential rather than public: claude.ai is a server-side client that can
  # keep a secret, and unlike the CLI it has no localhost allowance to fall back
  # on. Leaving the secret blank in the dialog would make Claude treat the id as
  # a public client, which this entry is not.
  # secretEnv, NOT `secret: $DEX_CLAUDE_CLIENT_SECRET`. Dex expands environment
  # variables only inside nested `config:` blocks -- storage, connectors,
  # signer -- because expandEnvInMap runs on those and nothing else. A top
  # level field like `secret` is taken literally, so the first attempt here
  # registered the client with the eleven characters "$DEX_CLAUDE..." as its
  # secret and rejected the real one. It fails as "invalid client credentials",
  # which reads exactly like a mistyped secret and sends you looking at the
  # wrong end. The GitHub connector below is what made this easy to get wrong:
  # its $VAR does expand, because it sits under `config:`.
  - id: claude-ai
    name: Claude
    secretEnv: DEX_CLAUDE_CLIENT_SECRET
    redirectURIs:
      - https://claude.ai/api/mcp/auth_callback

  # The Ludoteca's own client -- the browser app at
  # boardgames.chrispotter.io, signing a person in so the API will accept a
  # write from them (board-game-ui#12).
  #
  # Public, and not by choice: a single-page app cannot keep a secret. Every
  # REACT_APP_* value is substituted literally into the published bundle, so a
  # secret handed to the build would be readable by every visitor. PKCE is
  # what stands in for it -- the UI sends S256 of its own accord, which is the
  # only thing binding an authorization code to the browser that asked for
  # it, since oauth2.pkce cannot be enforced on v2.45.1 (see above).
  #
  # The redirect URI is exact. Dex matches a registered redirect character for
  # character and supports no wildcards, and the localhost allowance that
  # boardgames-mcp-cli leans on is for CLI clients only -- it does not help a
  # browser. /auth/callback is the path board-game-ui#27 settled on, and the
  # UI's nginx resolves it through its SPA fallback, so it loads the app
  # rather than 404ing. Changing it here alone breaks sign-in; it has to
  # change in both places at once.
  - id: boardgames-ui
    name: Ludoteca
    public: true
    redirectURIs:
      - https://boardgames.chrispotter.io/auth/callback

  # The HTTP API's entry: the twin of the MCP server's above, for exactly the
  # same reason. Dex signs `aud` as a client ID and implements no RFC 8707
  # `resource` parameter, so the only route from API_RESOURCE_URL into a
  # token's audience is the cross-client scope
  # audience:server:client_id:<peer> -- which means the peer's id has to BE
  # that URL, character for character.
  #
  # No flow ever runs as this client. trustedPeers is the whole point: Dex
  # refuses the cross-client scope unless the peer names the client asking
  # for it, so the UI is named here. Only the UI -- boardgames-mcp-cli and
  # claude-ai hold MCP tokens, which this API is supposed to refuse.
  - id: https://boardgames-api.chrispotter.io/api
    name: Board games API
    public: true
    trustedPeers:
      - boardgames-ui
