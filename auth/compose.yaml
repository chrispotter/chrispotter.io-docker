services:
  dex:
    # Pinned to v2.45.1. v2.46.0 hangs here, and that is now settled rather
    # than suspected.
    #
    # The first /keys hang recovered after a deploy that changed the version
    # AND added GOMEMLIMIT, so #11 put v2.46.0 back with GOMEMLIMIT kept, to
    # find out which had fixed it. /keys hung again under that combination,
    # and /auth with it -- every endpoint that touches storage blocks, while
    # /healthz and discovery go on answering instantly. GOMEMLIMIT was not the
    # fix; v2.46.0 is the fault.
    #
    # It does not hang at startup. It serves for a while and then stops, so a
    # deploy that checks /keys straight away passes, and an MCP container that
    # already cached the JWKS keeps working. It surfaced only when an unrelated
    # MCP redeploy came up with an empty key cache and every token
    # verification hung behind /keys -- which reads as a connector timeout,
    # not an auth failure.
    #
    # v2.45.1 has not been proven against this either: it ran for about four
    # hours before #11 replaced it. If it hangs the same way after a day or
    # two, the version was never the whole story.
    #
    # oauth2.pkce is gone from config.yaml as a result: v2.45.1 does not have
    # the key and would ignore it. Revisit when a v2.46.x fixes the hang.
    image: ghcr.io/dexidp/dex:v2.45.1
    container_name: dex
    restart: unless-stopped
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    networks: [edge]
    # Raised from 96m: dex was sitting at 84 MiB, far above the ~30 MB it is
    # meant to want, and a Go process does not see a cgroup limit unless
    # GOMEMLIMIT tells it. Kept on its own merits: it was not the /keys fix
    # (see the version pin above), but it did halve resident memory.
    mem_limit: 192m
    volumes:
      # Relative to this file -- compose `include` resolves an included
      # file's paths against its own location, not the project root.
      - ./config.yaml:/etc/dex/config.yaml:ro
      - dex-data:/var/dex
    environment:
      VIRTUAL_HOST: auth.chrispotter.io
      VIRTUAL_PORT: 5556
      LETSENCRYPT_HOST: auth.chrispotter.io
      # `:?` fails the deploy loudly if a secret is missing, rather than
      # starting Dex with an empty client secret and failing at login.
      DEX_GITHUB_CLIENT_ID: ${DEX_GITHUB_CLIENT_ID:?missing from .env}
      DEX_GITHUB_CLIENT_SECRET: ${DEX_GITHUB_CLIENT_SECRET:?missing from .env}
      # The confidential client claude.ai authenticates as. Same `:?`: a blank
      # secret would start Dex with a client nobody can use and fail at login.
      DEX_CLAUDE_CLIENT_SECRET: ${DEX_CLAUDE_CLIENT_SECRET:?missing from .env}

      # Without this the Go runtime grows the heap until the cgroup kills it,
      # because it cannot see mem_limit. Set below the limit so the GC works
      # harder as it approaches, rather than the kernel stepping in.
      GOMEMLIMIT: 160MiB

      # Dex never reads this. It exists so that Compose does.
      #
      # config.yaml is bind-mounted, so editing it changes nothing Compose can
      # see: the container spec is byte-identical before and after, `up -d`
      # finds nothing to do, and the old process keeps serving the old config.
      # Dex reads its config once at startup, so the edit silently does not
      # take effect -- a deploy that reports success and changed nothing.
      #
      # Not hypothetical: it is exactly how the MCP audience client in #4
      # reached the droplet and stayed invisible to Dex. Putting the file's
      # hash in the environment makes an edit part of the container spec, so
      # Compose recreates the container when -- and only when -- the config
      # actually changed.
      DEX_CONFIG_SHA: ${DEX_CONFIG_SHA:?missing from .env}
    healthcheck:
      # 127.0.0.1, not localhost: localhost resolves to ::1 first inside the
      # container and Dex binds IPv4 only -- the same trap that left splash
      # permanently unhealthy.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5556/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  dex-data:

networks:
  edge:
    external: true
