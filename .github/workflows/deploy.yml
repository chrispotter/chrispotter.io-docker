name: Deploy

# Builds the splash image and rolls it out to the droplet.
# Path filter keeps documentation-only commits from triggering a deploy.
on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'proxy/**'
      - 'auth/**'
      - 'compose.yaml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Never let two deploys touch the droplet at once. Deliberately not
# cancel-in-progress: interrupting a half-finished `compose up` is worse
# than making the next run queue behind it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/chrispotter/splash
  DEPLOY_HOST: 159.203.132.36
  DEPLOY_USER: deploy
  DEPLOY_PATH: /srv/chrispotter

jobs:
  build:
    name: Build and push splash
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive image tag
        id: meta
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/splash
          push: true
          # A moving :latest plus an immutable :sha- tag. Deploys pin the sha,
          # so rolling back is re-running this workflow at an older commit.
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to droplet
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned host key rather than StrictHostKeyChecking=no, so a
          # redirected deploy fails loudly instead of trusting whatever answers.
          printf '%s\n' '159.203.132.36 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPrYwXI1zLarZ04/fD7e/j9S08uVzOJPpQWrnWJ3Fud/' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Ship compose files and .env
        # Pushed from the runner rather than cloned on the droplet, so the
        # droplet needs no GitHub credentials and this works whether the repo
        # is public or private. Images come from GHCR; only the wiring travels.
        #
        # .env is built here and shipped inside the tar rather than written by
        # the remote shell, so no long-lived credential is ever passed as an
        # argument -- an ssh command line is visible in the droplet's process
        # list. (GHCR_TOKEN below still goes that route: it is scoped to this
        # run and expires with it, so the exposure window is worth the
        # simplicity. A BGG token is long-lived and is not.)
        env:
          TAG: ${{ needs.build.outputs.tag }}
          BGG_API_TOKEN: ${{ secrets.BGG_API_TOKEN }}
          DEX_GITHUB_CLIENT_ID: ${{ secrets.DEX_GITHUB_CLIENT_ID }}
          DEX_GITHUB_CLIENT_SECRET: ${{ secrets.DEX_GITHUB_CLIENT_SECRET }}
          DEX_CLAUDE_CLIENT_SECRET: ${{ secrets.DEX_CLAUDE_CLIENT_SECRET }}
          # The board-game images are built by the board-game-api repo, so
          # their tags cannot be derived from this repo's sha the way
          # SPLASH_TAG is. Variables, not secrets: pinning a deploy should be
          # a visible, editable change. Unset means :latest.
          BG_API_TAG: ${{ vars.BG_API_TAG || 'latest' }}
          BG_MCP_TAG: ${{ vars.BG_MCP_TAG || 'latest' }}
          # Built by board-game-ui, so the same reasoning applies.
          BG_UI_TAG: ${{ vars.BG_UI_TAG || 'latest' }}
          BG_DB_PASSWORD: ${{ secrets.BG_DB_PASSWORD }}
          BG_WRITE_TOKEN: ${{ secrets.BG_WRITE_TOKEN }}
          # An allowlist rather than a credential, so a variable -- one you
          # cannot read is one you cannot edit.
          BG_MCP_SUBJECTS: ${{ vars.BG_MCP_SUBJECTS }}
        run: |
          # Checked before .env is written, not after: the exit below skips
          # the `rm -f .env` at the end of this step, so validating first is
          # what keeps a failed deploy from leaving a file of secrets on the
          # runner. These are the values apps/boardgames/compose.yaml takes as
          # ${VAR:?}, caught here -- where the error names the one to set --
          # rather than as an opaque compose failure on the droplet after the
          # files have already been shipped.
          for required in BG_DB_PASSWORD BG_WRITE_TOKEN BG_MCP_SUBJECTS DEX_CLAUDE_CLIENT_SECRET BGG_API_TOKEN; do
            if [ -z "${!required}" ]; then
              echo "::error::${required} is empty. Set it in this repository's"\
                   "secrets (BG_DB_PASSWORD, BG_WRITE_TOKEN, BGG_API_TOKEN,"\
                   "DEX_CLAUDE_CLIENT_SECRET) or variables (BG_MCP_SUBJECTS)"\
                   "before deploying the board-game stack."
              exit 1
            fi
          done

          umask 077
          {
            printf 'SPLASH_TAG=%s\n' "${TAG}"
            printf 'BGG_API_TOKEN=%s\n' "${BGG_API_TOKEN}"
            printf 'DEX_GITHUB_CLIENT_ID=%s\n' "${DEX_GITHUB_CLIENT_ID}"
            printf 'DEX_GITHUB_CLIENT_SECRET=%s\n' "${DEX_GITHUB_CLIENT_SECRET}"
            printf 'DEX_CLAUDE_CLIENT_SECRET=%s\n' "${DEX_CLAUDE_CLIENT_SECRET}"
            printf 'BG_API_TAG=%s\n' "${BG_API_TAG}"
            printf 'BG_MCP_TAG=%s\n' "${BG_MCP_TAG}"
            printf 'BG_UI_TAG=%s\n' "${BG_UI_TAG}"
            printf 'BG_DB_PASSWORD=%s\n' "${BG_DB_PASSWORD}"
            printf 'BG_WRITE_TOKEN=%s\n' "${BG_WRITE_TOKEN}"
            printf 'BG_MCP_SUBJECTS=%s\n' "${BG_MCP_SUBJECTS}"
            # Hashed from the file this run is about to ship, so the value can
            # never describe a different config than the one that lands. See
            # auth/compose.yaml for why Dex needs this at all.
            printf 'DEX_CONFIG_SHA=%s\n' "$(sha256sum auth/config.yaml | cut -c1-12)"
          } > .env

          # auth/ ships whole -- it carries config.yaml as well as compose.yaml.
          tar czf - compose.yaml proxy/compose.yaml auth/ apps/*/compose.yaml .env \
            | ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=15 \
                "${DEPLOY_USER}@${DEPLOY_HOST}" \
                "mkdir -p '${DEPLOY_PATH}' && tar xzf - -C '${DEPLOY_PATH}'"

          rm -f .env

      - name: Pull and restart
        # NOTE on pulling the board-game images. GITHUB_TOKEN is scoped to this
        # repository, and ghcr.io/chrispotter/board-game-{api,mcp,ui} are
        # PRIVATE packages owned by board-game-api and board-game-ui --
        # different repositories. This token cannot pull them until each
        # package grants access, under
        #   Package settings -> Manage Actions access -> Add repository
        #       -> chrispotter.io-docker (Read)
        # on each of the three packages. Without it `docker compose pull` fails
        # with "denied" for those images only; splash, postgres and dex are
        # unaffected. The alternative is making the packages public.
        env:
          TAG: ${{ needs.build.outputs.tag }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=15 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            TAG="${TAG}" GHCR_USER="${GHCR_USER}" GHCR_TOKEN="${GHCR_TOKEN}" \
            DEPLOY_PATH="${DEPLOY_PATH}" 'bash -euo pipefail' <<'REMOTE'
          cd "${DEPLOY_PATH}"

          # Log in with the run-scoped GITHUB_TOKEN so a private package pulls
          # fine and no long-lived registry credential is left on the box.
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

          # .env arrived in the tar above. It holds a credential, so keep it
          # readable only by the deploy user.
          chmod 600 .env

          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f
          REMOTE

      - name: Verify services are up
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd '${DEPLOY_PATH}' && docker compose ps --format '{{.Service}}\t{{.Status}}'"
