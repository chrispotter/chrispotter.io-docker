name: Re-hydrate the Ludoteca

# Fills the gaps on every Linked game from BoardGameGeek, by calling the
# deployed API's own pass (board-game-api#41).
#
# It lives here rather than in board-game-api because the credential does.
# BG_WRITE_TOKEN is this repository's secret, so this is the only place a
# caller can be authorised without the token being copied somewhere else or
# handed to a person to paste.
#
# BROKEN BY OIDC, AND KNOWINGLY SO. The api service now authenticates through
# Dex and the two schemes are exclusive, so this call is refused with 401 from
# the moment that deploy lands. There is no machine path to a replacement
# token: Dex would mint one through client credentials, but the API's
# allowlist matches a verified email address and a client-credentials token
# carries none. Fixing it means the API accepting both schemes at once --
# chrispotter.io-docker#18 records the choice.
#
# Why it exists at all: adding a field to a game is not the end of adding a
# field. The column ships empty and the games already in the Ludoteca only
# acquire it when something hydrates them again, so every new facet needs a
# pass like this or it lands with the data missing.
#
# Dispatch only, never on a push. It writes to production and spends
# BoardGameGeek's rate-limited quota, and neither belongs in a deploy that
# someone triggered to change a hostname.
on:
  workflow_dispatch:

# One at a time. The API paces its own BoardGameGeek calls, but two runs are
# two processes and the pacing is per-process, so concurrent passes would
# double the request rate against a third party.
concurrency:
  group: rehydrate-production
  cancel-in-progress: false

env:
  API: https://boardgames-api.chrispotter.io

jobs:
  rehydrate:
    name: Hydrate every linked game
    runs-on: ubuntu-latest
    steps:
      - name: Call the pass
        env:
          # The secret the api service used to accept as API_WRITE_TOKEN,
          # and no longer does. See the header.
          WRITE_TOKEN: ${{ secrets.BG_WRITE_TOKEN }}
        run: |
          if [ -z "${WRITE_TOKEN}" ]; then
            echo "::error::BG_WRITE_TOKEN is empty; set it in this repository's secrets."
            exit 1
          fi

          # Generous but bounded. The pass is synchronous: a hundred games is
          # a handful of BoardGameGeek calls at ~600ms apart plus the writes,
          # so seconds rather than minutes -- but a cold cache and a slow
          # upstream should not hang this job forever.
          status=$(curl -sS -X POST "${API}/api/games/hydrate" \
            -H "Authorization: Bearer ${WRITE_TOKEN}" \
            -H 'Content-Length: 0' \
            --max-time 300 \
            -o report.json -w '%{http_code}')
          echo "status=${status}" >> "$GITHUB_ENV"
          echo "HTTP ${status}"

      - name: Summarise the report
        # Runs even when the call failed: the API returns the partial report
        # alongside an upstream error, and how far the pass got is exactly
        # what someone deciding whether to re-run needs to know.
        if: always()
        run: |
          if [ ! -s report.json ]; then
            echo "::error::no response body to report on"
            exit 1
          fi

          # Totals first, then only the games that need a person: an id
          # BoardGameGeek does not know is a mis-link to correct by hand,
          # while a failed write is worth re-running.
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os

          with open("report.json") as f:
              body = json.load(f)
          report = body.get("report") or {}

          print("### Re-hydration")
          print()
          if error := body.get("error"):
              print(f"**Stopped:** {error}")
              print()
          print("| | |")
          print("| --- | --- |")
          for label, key in (
              ("Linked games considered", "considered"),
              ("Hydrated", "hydrated"),
              ("Unknown to BoardGameGeek", "unknownToBoardGameGeek"),
              ("Failed", "failed"),
          ):
              print(f"| {label} | {report.get(key, 0)} |")

          needing_attention = [
              o for o in report.get("outcomes", [])
              if o.get("status") != "hydrated"
          ]
          if needing_attention:
              print()
              print("#### Games needing a person")
              print()
              print("| Game | BGG id | Status | Why |")
              print("| --- | --- | --- | --- |")
              for o in needing_attention:
                  print(f"| {o.get('name')} | {o.get('bggId')} | {o.get('status')} | {o.get('error', '')} |")

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"failed={report.get('failed', 0)}\n")
              out.write(f"unknown={report.get('unknownToBoardGameGeek', 0)}\n")
              out.write(f"hydrated={report.get('hydrated', 0)}\n")
          PY
        id: summary

      - name: Decide the outcome
        if: always()
        run: |
          # A mis-link is not this job's failure: nothing is wrong with the
          # run, a stored id is wrong, and only a person can say which entry
          # the game really is. Warn, and leave the run green.
          if [ "${{ steps.summary.outputs.unknown }}" -gt 0 ] 2>/dev/null; then
            echo "::warning::${{ steps.summary.outputs.unknown }} game(s) carry a BoardGameGeek id that BGG does not know -- see the summary and correct the link."
          fi

          # A failed write or a stopped pass is. Both are worth re-running.
          if [ "${status}" != "200" ]; then
            echo "::error::the API answered ${status}; the summary shows how far the pass got"
            exit 1
          fi
          if [ "${{ steps.summary.outputs.failed }}" -gt 0 ] 2>/dev/null; then
            echo "::error::${{ steps.summary.outputs.failed }} game(s) failed to write; re-running is safe -- nothing is ever overwritten"
            exit 1
          fi
          echo "Hydrated ${{ steps.summary.outputs.hydrated }} game(s)."
